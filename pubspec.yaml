name: conecta_lsb
description: "Conecta LSB - Comunicación accesible con traducción de Lengua de Señas Boliviana"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_tts: ^4.2.2
  speech_to_text: ^7.2.0
  google_fonts: ^6.2.1
  appwrite: ^13.0.0
  uuid: ^4.3.3
  flutter_web_auth_2: ^5.0.0

dependency_overrides:
  flutter_web_auth_2: ^5.0.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true